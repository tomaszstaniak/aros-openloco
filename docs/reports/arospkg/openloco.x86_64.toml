# DRAFT for the arospkg index - NOT approved. Written by the port's author for
# the index maintainer. status stays "draft" until the apkg test on AROS One
# passes and the maintainer approves it.
#
# The archive is the GitHub PRERELEASE v0.1.0-rc1 of the port: a test
# release. How the index shows a prerelease to users is to be agreed with the
# index maintainer (there is no field for it yet); the summary says it.
#
# Before use: the player needs their OWN copy of Chris Sawyer's Locomotion
# (not included, commercial) and must start the game with Run-OpenLoco, which
# sets a 1 MB stack - the default 40 KB Shell stack crashes it:
#     cd SYS:Packages/openloco        (or wherever apkg installed it)
#     execute Run-OpenLoco
# Details: https://github.com/tomaszstaniak/aros-openloco#getting-the-locomotion-files

status          = "draft"
id              = "openloco"
version         = "0.1.0-rc1"
revision        = 1
summary         = "OpenLoco (Locomotion re-implementation), TEST release - needs your own Locomotion files, start with Run-OpenLoco"
arch            = "x86_64"
abi             = "v11"
category        = "game/strategy"
url             = "https://github.com/tomaszstaniak/aros-openloco/releases/download/v0.1.0-rc1/openloco.x86_64-aros-v11.lha"
size            = 16998333
sha256          = "59fb5f11a8fe848f249d2a3399b67d6d28f617d52c167307c3d2a596d320efe0"
kind            = "app"

depends         = []
depends_checked = true
subdir          = "OpenLoco"
# no icon: rc1 has no drawer icon (planned for a later release)
installs_on     = ["aros-one"]         # apkg 0.1 (ca010440), AROS One 1.3, 2026-09-25
runs_on         = ["aros-one"]         # menu, map, save, reload after reinstall - same run
does_not_run_on = ["mainline-x86_64"]  # ABIv11 binary; mainline is ABIv1

# Derived from the rc1 binary (tools/deps.py + strings), filtered per the
# manifest guide 4.3. openal.library is opened by the link stubs at startup,
# so without it the program cannot start. bsdsocket.library is NOT required:
# the port opens it only when networking is first used. crt/m/stdlib: see the
# note sent with this draft - to be settled with the maintainer, not copied.
# On the test machine all four were present: openal.library 45.2 (apkg:
# "satisfied, already open, version 45"), crt.library 5.2, m.library 1.0,
# stdlib.library 3.0. crt/m/stdlib are part of AROS One itself, so by guide
# 4.3 step 1 they are left out here; the maintainer decides.
[[requires_system]]
type = "library"
id   = "openal.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-openloco"
revision   = "v0.1.0-rc1"
built_with = "abiv11-x86_64, GCC 10.5.0 (AROS One SDK); upstream OpenLoco 7f8c90cf"
